services:
  # 1. Backend Service (Django)
  - type: web
    name: event-booking-api
    env: python
    buildCommand: ./backend/build.sh
    startCommand: gunicorn core.wsgi:application --chdir backend
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: event-booking-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
      - key: FRONTEND_URL
        value: https://event-booking-app.onrender.com

  # 2. Frontend Service (React)
  - type: web
    name: event-booking-app
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://event-booking-api.onrender.com/api/
    routingRules:
      - route: /.*
        destination: /index.html

databases:
  - name: event-booking-db
    databaseName: event_booking
    user: admin
